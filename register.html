<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souk10</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <div id="site-header"></div>

  <main class="main container auth-wrap">
    <div class="auth-card">
      <h1 data-i18n="register_title"></h1>
      <form id="auth-form" novalidate>
        <label class="field">
          <span data-i18n="f_name"></span>
          <input name="name" required maxlength="100">
        </label>
        <label class="field">
          <span data-i18n="f_email"></span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <div class="field-row">
          <label class="field">
            <span data-i18n="f_password"></span>
            <input name="password" type="password" required minlength="6" autocomplete="new-password">
          </label>
          <label class="field">
            <span data-i18n="f_password2"></span>
            <input name="password2" type="password" required minlength="6" autocomplete="new-password">
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span data-i18n="f_phone"></span>
            <input name="phone" data-i18n-ph="f_phone_ph" maxlength="30">
          </label>
          <label class="field">
            <span data-i18n="f_city"></span>
            <input name="city" list="cities-dl" data-i18n-ph="f_city_ph">
            <datalist id="cities-dl"></datalist>
          </label>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit" data-i18n="btn_register"></button>
      </form>
      <p class="auth-alt"><span data-i18n="have_account"></span> <a href="login.html" data-i18n="nav_login"></a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
