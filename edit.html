<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souk10</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edit">
  <div id="site-header"></div>

  <main class="main container form-page">
    <div class="form-card">
      <h1 data-i18n="edit_title"></h1>
      <form id="listing-form" novalidate>
        <label class="field">
          <span data-i18n="f_title"></span>
          <input name="title" required maxlength="150" data-i18n-ph="f_title_ph">
        </label>
        <label class="field">
          <span data-i18n="f_desc"></span>
          <textarea name="description" rows="4" data-i18n-ph="f_desc_ph"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span data-i18n="f_price"></span>
            <input name="price" type="number" min="1" step="0.01" required>
          </label>
          <label class="field">
            <span data-i18n="f_category"></span>
            <select name="category_id" id="f-cat" required></select>
          </label>
        </div>
        <label class="field">
          <span data-i18n="f_city"></span>
          <input name="city" list="cities-dl">
          <datalist id="cities-dl"></datalist>
        </label>
        <div id="current-img-zone"></div>
        <div class="field">
          <span data-i18n="f_image"></span>
          <div class="hint" style="margin-bottom:6px" data-i18n="f_image_keep"></div>
          <div class="upload-box" id="upload-box" role="button" tabindex="0">
            <input type="file" name="image" id="f-image" accept="image/jpeg,image/png,image/gif,image/webp">
            <span class="up-ico">📷</span>
            <span class="up-txt" data-i18n="upload_drop"></span>
            <span class="hint" data-i18n="f_image_hint"></span>
          </div>
          <div id="preview-zone"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit" data-i18n="btn_save"></button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/form.js"></script>
</body>
</html>
