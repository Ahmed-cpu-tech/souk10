<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souk10</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <main class="main container auth-wrap">
    <div class="auth-card">
      <h1 data-i18n="login_title"></h1>
      <form id="auth-form" novalidate>
        <label class="field">
          <span data-i18n="f_email"></span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label class="field">
          <span data-i18n="f_password"></span>
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit" data-i18n="btn_login"></button>
      </form>
      <p class="auth-alt"><span data-i18n="no_account"></span> <a href="register.html" data-i18n="nav_register"></a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
